const personA = patient(365, mat.skinA, mat.shirtA, false);
const personB = patient(623, mat.skinB, mat.shirtB, true);
// A small unlabelled inhaler beside the calm patient's stool, in the free gap

const inhaler = screenGroup(382, 462, 34), inhalerClay = clay('#759fa6', 3);
blob(inhaler, inhalerClay, -3, 0, 0, 11, 20, 9);
blob(inhaler, mat.cream, -3, 12, 0, 7, 15, 6);
blob(inhaler, inhalerClay, 9, -12, 2, 19, 8, 11);
blob(inhaler, mat.darkTeal, 25, -12, 3, 3, 5, 7);

function puff(meter, strong) {
  const group = new THREE.Group(); meter.group.add(group);
  const size = strong ? 1 : .55;
  for (let i = 0; i < 12; i++) {
    const x = (random() - .5) * 58 * size, y = (random() - .5) * 22 * size;
    blob(group, mat.cotton, x, y, 10 + random() * 10, (14 + random() * 10) * size, (10 + random() * 7) * size, (10 + random() * 9) * size);
  }
  blob(group, mat.white, 27 * size, 0, 12, 20 * size, 22 * size, 18 * size);
  for (let i = 0; i < 3; i++) blob(group, mat.cotton, (-45 - i * 19) * size, (i - 1) * 4, 8, (14 - i * 3) * size, (7 - i) * size, 6 * size);
  return { group, strong, meter };
}
const puffs = [puff(control, false), puff(exercise, true), puff(exercise, true), puff(exercise, true)];

// Sparse felt fibres: no object, typography, or key action enters the reserve.
const grain = document.getElementById('grain'); grain.width = 480; grain.height = 270;
const gctx = grain.getContext('2d'), noise = gctx.createImageData(480, 270);
for (let i = 0; i < noise.data.length; i += 4) { const v = random() * 255; noise.data[i] = noise.data[i + 1] = noise.data[i + 2] = v; noise.data[i + 3] = 255; }
gctx.putImageData(noise, 0, 0);

const controlValue = document.getElementById('control-value'); controlValue.style.left = `${valueX(200.33)}px`;
const exerciseValue = document.getElementById('exercise-value');
const controlDelta = document.getElementById('control-delta'), exerciseDelta = document.getElementById('exercise-delta');
const stops = [288, 318.67, 379], tokens = stops.map((v, i) => {
  const tag = document.getElementById(`session-${i + 1}`); tag.style.left = `${valueX(v)}px`; return tag;
});
const clamp = n => Math.max(0, Math.min(1, n));
const smooth = n => { n = clamp(n); return n * n * (3 - 2 * n); };
function timeline(seconds) {
  const frame = Math.floor(Math.max(0, seconds) * 12 + 1e-7), t = frame / 12;
  const a = smooth((t - .8333333333) / .25);
  const b = smooth((t - 1.1666666667) / .25);
  const c = smooth((t - 1.5) / .3333333333);
  const value = 202.67 + (288 - 202.67) * a + (318.67 - 288) * b + (379 - 318.67) * c;
  return { frame, t, control: 200.33 + 25.67 * a, exercise: value,
    completed: t >= 1.8333333333 ? 3 : t >= 1.4166666666 ? 2 : t >= 1.0833333333 ? 1 : 0 };
}
function setMeter(meter, value, frame, seed) {
  // Local z=0 is the calibrated image plane: anchor positions match r1 exactly.
  meter.slider.position.set(valueX(value) - 1030, 0, 0);
  meter.slider.rotation.z = Math.sin(frame * 2.31 + seed) * .014;
  const length = valueX(value) - valueX(meter.baseline);
  meter.ribbon.visible = length > .01;
  meter.ribbon.position.x = valueX(meter.baseline) - 1030 + length / 2;
  meter.ribbon.scale.x = Math.max(.001, length / 2);
  meter.shell.scale.y = 1 + Math.sin(frame * 2.13 + seed) * .0025;
}
function pop(el, t, start) {
  const age = t - start, u = clamp(age / (2 / 12));
  el.style.visibility = age < 0 ? 'hidden' : 'visible';
  const s = age < 0 ? 0 : u < .5 ? .8 + u * .58 : 1.09 - (u - .5) * .18;
  el.style.transform = `translate(-50%, -50%) scale(${s}) rotate(${Math.sin(Math.floor(t * 12) * 1.93) * .25}deg)`;
}
function showPuff(p, t, start, contact, end, initial, current, frame) {
  const group = p.group, u = clamp((t - start) / (contact - start));
  group.visible = t >= start && t < end + 1 / 12;
  if (!group.visible) return;
  const gap = p.strong ? 43 : 27;
  // Travel to the resting pin first, then stay in contact for the entire push.
  const x = t < contact ? 403 + (valueX(initial) - gap - 403) * u : valueX(current) - gap;
  group.position.set(x - 1030, 0, 1);

function figureEffort(t, energetic) {

  const pulses = [[2 / 3, 5 / 6, 13 / 12]];

  let effort = t < 2 / 3 ? .18 + .12 * smooth(t / (2 / 3)) : 0;

function animatePatient(person, t, frame, index) {

  // posture move, so the mouthpiece remains visibly inside the pursed lips.

  const points = person.head.geometry.attributes.position;

function renderAt(seconds) {

  showPuff(puffs[1], t, 2 / 3, 5 / 6, 13 / 12, 202.67, state.exercise, frame);
  showPuff(puffs[2], t, 1, 7 / 6, 17 / 12, 288, state.exercise, frame);
  showPuff(puffs[3], t, 4 / 3, 3 / 2, 11 / 6, 318.67, state.exercise, frame);

const params = new URLSearchParams(location.search);
const requested = params.has('t') ? Number(params.get('t')) : NaN;
if (Number.isFinite(requested)) {
