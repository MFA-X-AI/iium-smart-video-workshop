Research: Wicesa, Syed Salleh, Mohd Arshad & Shaikh (2026), Measuring Human
Capital in Indonesia Using an Adapted World Bank HCI Framework, MJSSH 11(6).
Province averages/categories: Table 6, pp. 12–13. Class intervals: Table 4,
pp. 9–10. Annual ranges: Fig. 5, p. 21 and text p. 20, exactly as printed.
DI Yogyakarta highest and Papua lowest each year: Table 5, pp. 11–12.
“No clear evidence of convergence”: p. 22. Composite global Moran's I = 0.051,
p = 0.116 (Table 8, p. 16): class reveal does not imply a geographic wave.

via https://cdn.jsdelivr.net/gh/ans-4175/peta-indonesia-geojson@1.0/indonesia-prov.geojson.
The supplied prov-simple.json is embedded without changing its geometry.
Artistic licence: colour, typography, layout, class reveal order and timing.
The red connector encodes nothing by its length. Bars use a true zero baseline.
-->

  connector.setAttribute('x2',start[0]+dx*line);
  connector.setAttribute('y2',start[1]+dy*line);
  connector.setAttribute('opacity',line>0?1:0);
  firstTick.setAttribute('opacity',line>0?1:0);
  lastTick.setAttribute('opacity',line===1?1:0);
  $('gap-strip').setAttribute('opacity',t>=1.25?1:0);
  for (const b of bars) {
    const p = progress(t,b.at,.07);
    const height = b.value*3.6*ease(p);
    b.bar.setAttribute('height',height);
    b.bar.setAttribute('y',994-height);
    b.label.setAttribute('opacity',t>=b.lands?1:0);
  }
  // Discrete cuts at the same landing times as the bar labels; never interpolate values.
  const landed = bars.filter(b=>t>=b.lands).length;
  const activeYear = Math.max(0,landed-1);
  $('gap-readout').setAttribute('opacity',landed>0?1:0);
  $('gap-year').textContent = String(2011+activeYear);
  $('gap-number').textContent = annual[activeYear].toFixed(2);
  $('gap-comparison').setAttribute('opacity',landed===annual.length?1:0);
  $('conclusion').setAttribute('opacity',progress(t,2.05,.25));
}
async function boot() {
  await document.fonts.ready;
  const raw = new URLSearchParams(location.search).get('t');
  const seconds = raw===null ? null : Number(raw);
  if (seconds!==null && Number.isFinite(seconds)) {
    render(Math.max(0,Math.min(3,seconds)));
    document.documentElement.dataset.ready = 'true';
    return;
  }
  render(0);
  document.documentElement.dataset.ready = 'true';
  const epoch = performance.now();
  function frame(now) {
    const t = Math.min(3,(now-epoch)/1000);
    render(t);
    if (t<3) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
boot();
</script>
</body>
