not a subject. The assembly, scanner and color change illustrate calibration,

    const cornerGeometry = new THREE.BufferGeometry();
    cornerGeometry.setAttribute('position', new THREE.Float32BufferAttribute(cornerX.flatMap(x => [x, EYE_Y, 50]), 3));
    const cornerMaterial = new THREE.ShaderMaterial({
      uniforms: { uOpacity: { value: 0 } },
      vertexShader: `void main() { gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_PointSize = 25.0; }`,
      fragmentShader: `uniform float uOpacity; void main() { float d = length(gl_PointCoord - vec2(0.5)); if (d > 0.5) discard; float a = exp(-d*d*100.0) + 0.28*exp(-d*d*14.0); gl_FragColor = vec4(1.0, 0.66, 0.23, a*uOpacity); }`,
      transparent: true, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending
    });
    scene.add(new THREE.Points(cornerGeometry, cornerMaterial));

    const ghost = strip(0xff298c, 1.1);
    const beam = strip(0xff298c, 3);
    const beamCore = strip(0xffffff, .8);
    const tip = strip(0xff298c, 34);
    const band = strip(0x6bdccb, 56);
    const bandMid = strip(0x9efbe8, 1);
    const MAGENTA = new THREE.Color(0xff298c), MINT = new THREE.Color(0x50ffd1);
    const sweep = new THREE.Group();
    for (let j = -2; j <= 2; j++) {
      const p = j * 12;
      const g = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(p - 13, 392, 50), new THREE.Vector3(p + 13, 414, 50),
        new THREE.Vector3(p + 13, 527, 50), new THREE.Vector3(p - 13, 549, 50)
      ]);
      const m = new THREE.LineBasicMaterial({ color: 0x71ffdc, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthTest: false });
      sweep.add(new THREE.Line(g, m));
    }
    scene.add(sweep);

    const el = id => document.getElementById(id);
    const opacity = (id, v) => el(id).setAttribute('opacity', v.toFixed(4));
    el('crosshairs').setAttribute('d', [LEFT, DIRECT].map(x => `M${x - 12} 470 H${x + 12} M${x} 458 V482`).join(' '));
    el('before-leader').setAttribute('d', `M${DIRECT} 455 L1337 421 V294 H1343`);
    el('eye-dimension').setAttribute('d', `M${LEFT - HALF_EYE} 481 V530 M${LEFT + HALF_EYE} 481 V530 M${LEFT - HALF_EYE} 523 H${LEFT + HALF_EYE}`);
    el('eye-dimension-leader').setAttribute('d', `M${LEFT} 523 L521 555 H325`);
    el('after-leader').setAttribute('d', `M${CALIBRATED} 483 L1280 564 H1337`);
    el('overshoot-bracket').setAttribute('d', `M${TRUE} 451 V443 H${DIRECT} V451 M${DIRECT} 451 V487`);
    el('agreement-outline').setAttribute('d', `M${LOW} 440 V498 M${HIGH} 440 V498 M${LOW} 442 H${HIGH} M${LOW} 496 H${HIGH}`);
    el('agreement-leader').setAttribute('d', `M${HIGH} 498 L1319 704 H1337`);
    el('loupe-connectors').setAttribute('d', `M${TRUE - 24} 444 L1063 391 M${DIRECT + 12} 444 L1290 391`);
    el('loupe-true').setAttribute('d', `M${LOUPE_TRUE} 284 V351 M${LOUPE_TRUE - 5} 284 H${LOUPE_TRUE + 5} M${LOUPE_TRUE - 5} 351 H${LOUPE_TRUE + 5}`);
    el('loupe-true-label').setAttribute('x', LOUPE_TRUE + 11);
    el('loupe-calibrated-label').setAttribute('x', loupeX(CALIBRATED) - 5);
    el('loupe-calibrated-leader').setAttribute('d', `M${loupeX(CALIBRATED) - 4} 308 H${loupeX(CALIBRATED)} V${LOUPE_Y}`);
    el('loupe-ghost').setAttribute('d', `M1009 ${LOUPE_Y} H${loupeX(DIRECT)} M${loupeX(DIRECT)} 311 V343`);
    el('loupe-bracket').setAttribute('d', `M${LOUPE_TRUE} 297 V285 H${loupeX(DIRECT)} V297`);
    el('loupe-direct-label').setAttribute('x', (LOUPE_TRUE + loupeX(DIRECT)) / 2);
    let loupeTicks = `M${loupeX(TRUE - 3 * SCALE)} 362 H${loupeX(TRUE + 4 * SCALE)}`;
    for (let mm = -3; mm <= 4; mm++) {
      const x = loupeX(TRUE + mm * SCALE);
      loupeTicks += ` M${x} 356 V${mm === 0 ? 373 : 368}`;
    }
    el('loupe-ruler').setAttribute('d', loupeTicks);

    // Timeline is a pure function of t: direct seeks and autoplay have identical states.
    function stateAt(t) {
      const correction = smooth(1.12, 1.49, t);
      const firing = 1 - Math.pow(1 - clamp((t - .50) / .31), 3);
      return {
        t,
        corners: smooth(.24, .43, t),
        reference: smooth(.32, .49, t),
        firing,
        correction,
        endpoint: mix(LEFT, mix(DIRECT, CALIBRATED, correction), firing),
        before: smooth(.67, .88, t),
        after: smooth(1.23, 1.44, t),
        agreement: smooth(1.85, 2.19, t),
        ghost: smooth(1.12, 1.36, t) * mix(.55, .21, smooth(1.8, 2.5, t)),
        sweep: smooth(1.10, 1.18, t) * (1 - smooth(1.49, 1.68, t))
      };
    }
    function renderAt(t) {
      const s = stateAt(t);
      faceUniforms.uTime.value = t;
      eyeWidths.forEach(line => line.material.opacity = s.corners * .77);
      cornerMaterial.uniforms.uOpacity.value = s.corners * (1 + .13 * Math.sin(t * 7));
      placeStrip(ghost, LEFT, DIRECT, EYE_Y, s.ghost);
      placeStrip(beam, LEFT, s.endpoint, EYE_Y, s.firing * .92);
      placeStrip(beamCore, LEFT, s.endpoint, EYE_Y, s.firing * .61);
      placeStrip(tip, s.endpoint - .65, s.endpoint + .65, EYE_Y, s.firing);
      beam.material.color.copy(MAGENTA).lerp(MINT, s.correction);
      tip.material.color.copy(beam.material.color);
      placeStrip(band, LOW, HIGH, EYE_Y, s.agreement * .064);
      placeStrip(bandMid, LOW, HIGH, EYE_Y, s.agreement * .22);
      sweep.position.x = mix(LEFT, DIRECT, s.correction);
      sweep.children.forEach((line, j) => line.material.opacity = s.sweep * (.72 - Math.abs(j - 2) * .19));
      opacity('reference', s.reference);
      opacity('norm', s.corners);
      opacity('midpoints', s.reference);
      opacity('before', s.before * mix(1, .82, s.correction));
      opacity('overshoot-bracket', mix(1, .32, smooth(1.5, 2.5, t)));
      // The result appears as a complete phrase, preserving all numeric precision.
      opacity('before-copy', smooth(.74, .94, t));
      opacity('after', s.after);
      opacity('agreement', s.agreement);
      opacity('loupe', smooth(.58, .83, t));
      // This is an enlarged endpoint crop: positions and ruler share exactly ×4.
      const enlargedEnd = Math.max(1009, loupeX(s.endpoint));
      const loupeColor = `rgb(${Math.round(mix(255, 107, s.correction))},${Math.round(mix(87, 255, s.correction))},${Math.round(mix(172, 220, s.correction))})`;
      el('loupe-beam').setAttribute('d', `M1009 ${LOUPE_Y} H${enlargedEnd}`);
      el('loupe-end').setAttribute('d', `M${enlargedEnd} 311 V343`);
      el('loupe-beam').style.stroke = loupeColor;
      el('loupe-end').style.stroke = loupeColor;
      opacity('loupe-ghost', s.correction * .40);
      opacity('loupe-bias', mix(1, .60, s.correction));
      opacity('loupe-calibrated-label', s.after);
      opacity('loupe-calibrated-leader', s.after);
      composer.render();
      return s;
    }
    const params = new URLSearchParams(location.search);
    const parsed = Number(params.get('t'));
    const frozen = params.has('t') && Number.isFinite(parsed);
    const start = performance.now();
    const time = frozen ? Math.max(0, Math.min(3, parsed)) : 0;
    renderAt(time);
    // Useful for capture tooling without adding any on-screen controls.
    window.__KICT = { renderAt, stateAt, pointCount: FACE.vertices.length, scale: SCALE, ready: true };
    document.documentElement.dataset.ready = 'true';
    if (!frozen) {
      const animate = now => {
        renderAt(((now - start) / 1000) % 3);
        requestAnimationFrame(animate);
      };
      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
