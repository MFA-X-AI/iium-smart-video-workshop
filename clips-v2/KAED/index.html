  const mosqueRing=circlePoints(861,629,50,96,1.1).map(([x,y])=>[x,629+(y-629)*.72]);
  stroke(mosqueRing,.49,.29,{width:1.65,color:INK,opacity:.87,category:'mosque'});
  stroke(mosqueRing.slice(10,45).map(([x,y])=>[x+1.1,y-.7]),.64,.145,{width:.65,color:INK,opacity:.44,category:'mosque'});

  // Pencil accommodation circles retain Figure 6's scale and placement.
  [[695,345,150],[430,1090,150]].forEach(([x,y,r],i)=>{
    mapStroke(circlePoints(x,y,r,100,1.2),.9+i*.09,.3,{width:1.1,color:'#666b5b',opacity:.62,category:'zone'});
    mapStroke(circlePoints(x+1.8,y-.8,r+2.6,100,.7).slice(12,79),1.05+i*.09,.28,{width:.48,color:'#777b67',opacity:.4,category:'zone'});
  });

  const sceneRecordEnd=records.length;
  // Left-margin title, fully present throughout the three-second shot.
  drafting('Market and',76,174,55);
  drafting('mosque most',76,239,55);
  drafting('connected;',76,304,55);
  drafting('homes kept',76,369,55);
  drafting('private',76,434,55);
  stroke([[78,457],[197,458],[239,456]],0,0,{width:1.2,opacity:.58,safe:false});

  // On-plan lettering uses the pen alphabet, laid out horizontally after rotation.
  lettering('MAIN MARKET STREET',735,564,18,.55,.48,{align:'center',color:'#803d33',width:1.65});
  lettering('JUMA MASJID',856,691,23,.475,.30,{align:'center',width:1.8});
  stroke([[858,662],[860,643]],.64,.22,{width:1.05,category:'leader',safe:false});
  lettering('ACCOMMODATION',820,202,18,1.02,.32,{align:'center',width:1.45});
  lettering('ZONE',820,229,18,1.25,.19,{align:'center',width:1.45});
  lettering('ACCOMMODATION',474,864,17,1.04,.31,{align:'center',width:1.4});
  lettering('ZONE',474,890,17,1.28,.16,{align:'center',width:1.4});
  stroke([[564,865],[696,848],[744,829]],1.3,.16,{width:.85,opacity:.7,safe:false,category:'leader'});

  // Margin annotations are research findings, not interface controls.
  const northAnchor=project([785,377]);
  stroke([northAnchor,[1168,304],[1227,304]],1.82,.22,{width:1.05,opacity:.76,category:'leader',safe:false});
  stroke([[northAnchor[0]-3,northAnchor[1]-3],[northAnchor[0]+3,northAnchor[1]+3]],1.82,.05,{width:1,category:'leader',safe:false});
  drafting('quieter lanes ·',1250,287,30,1.87,.22);
  drafting('higher controllability',1250,329,30,2.01,.25);
  const marketAnchor=project([790,873]);
  stroke([marketAnchor,[1154,477],[1227,477]],1.78,.23,{width:1.1,opacity:.8,category:'leader',safe:false});
  stroke([[marketAnchor[0]-3,marketAnchor[1]+3],[marketAnchor[0]+3,marketAnchor[1]-3]],1.8,.06,{width:1.1,category:'leader',safe:false});
  drafting('most integrated ·',1250,461,30,1.88,.24);
  drafting('low controllability',1250,503,30,2.05,.24);
  // The note's content is verbatim from the brief; its numbers are correlations.
  stroke([[1237,590],[1849,591],[1847,744],[1238,743],[1237,590]],1.99,.23,{width:1.1,opacity:.67,category:'note',safe:false});
  drafting('integration vs controllability',1258,628,29,2.02,.13);
  drafting('city-wide correlation −0.205 · local +0.149',1258,676,26,2.10,.15,{tracking:.1});
  drafting('both weak',1258,718,27,2.19,.09);

  const defs='';
  const accessible='<title id="sheet-title">Market and mosque most connected; homes kept private</title><desc id="sheet-description">An ink and watercolour plan of Itchan Kala. The red main market street meets the orange secondary axis beside Juma Masjid. Accommodation zones have quieter lanes and higher controllability. Integration vs controllability: city-wide correlation −0.205 · local +0.149; both weak.</desc>';
  function state(r,t) {
    const p=progress(t,r.start,r.duration);
    // Clear the paper just ahead of the pen rather than erasing an entire
    // unwritten label band at its first letter.
    if(r.kind==='halo')return {opacity:p>0?r.cap:0,width:fmt(r.attrs.width*Math.min(1,p+.08))};
    if(r.kind==='brush')return {opacity:p>0?r.cap:0,d:p>=1?r.full:ribbonPath(r.samples,r.len*p)};
    return r.kind==='draw' ? {opacity:p>0?r.cap:0,'stroke-dasharray':`${fmt(r.len)} ${fmt(r.len+.01)}`,'stroke-dashoffset':fmt(r.len*(1-p))} : {opacity:fmt(r.cap*p)};
  }
  function partialPath(points,amount) {
    const result=[points[0]];
    let remaining=amount;
    for(let i=1;i<points.length;i++) {
      const a=points[i-1],b=points[i],len=Math.hypot(b[0]-a[0],b[1]-a[1]);
      if(remaining>=len) { result.push(b); remaining-=len; }
      else { const q=len?remaining/len:0; result.push([a[0]+(b[0]-a[0])*q,a[1]+(b[1]-a[1])*q]);break; }
    }
    return pathData(result);
  }
  function element(r,t,portable=false) {
    const attrs={id:r.id,...r.attrs,...state(r,t)};
    // The optional export flattens dashes for limited non-browser SVG renderers.
    // It is derived from the same length and progress used in the live SVG.
    if(portable&&r.kind==='draw') {
      attrs.d=partialPath(r.points,r.len*progress(t,r.start,r.duration));
      delete attrs['stroke-dasharray']; delete attrs['stroke-dashoffset'];
    }
    return '<'+r.tag+' '+Object.entries(attrs).map(([k,v])=>k+'="'+escape(String(v))+'"').join(' ')+'/>';
  }
  function contentAt(t,portable=false) { return accessible+defs+paper+records.map(r=>element(r,t,portable)).join(''); }
  function svgAt(t,portable=false) { return `<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">${contentAt(Math.max(0,Math.min(3,t)),portable)}</svg>`; }
  // Exposed for non-browser geometry checks and deterministic SVG frame exports.
  globalThis.KAED={svgAt,project,records,audit,streets,state,inkSchedule,sceneRecordEnd,duration:3};
  if(typeof document==='undefined')return;
  const root=document.getElementById('sheet');
  const raw=new URLSearchParams(location.search).get('t');
  const number=raw===null?NaN:Number(raw);
  const frozen=raw!==null&&raw.trim()!==''&&Number.isFinite(number);
  const initial=frozen?Math.max(0,Math.min(3,number)):0;
  root.innerHTML=contentAt(initial);
  if(frozen)return;
  const nodes=records.map(r=>document.getElementById(r.id));
  const started=performance.now();
  let previous=-1;
  function frame(now) {
    const t=Math.min(3,(now-started)/1000);
    for(let i=0;i<records.length;i++) {
      const r=records[i];
      if(t<r.start||previous>=r.start+r.duration)continue;
      const attrs=state(r,t);
      for(const [k,v]of Object.entries(attrs))nodes[i].setAttribute(k,v);
    }
    previous=t;
    if(t<3)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
