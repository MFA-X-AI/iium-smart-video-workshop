Memory Alloy (SMA) Spring as Actuators in Wrist Exoskeleton, pp.455–463.

electrical heating of the dorsal pair for extension and the palmar pair for
flexion; opposing actuation aids reversal. The measured first extension peak

construction, blueprint-to-solid sweep, camera push-in, pose outlines, illustrative
35-degree extension and 22-degree flexion. Amber denotes heating, NOT visible
incandescence. No clinical recovery, real-time speed, sideward performance,
additional cooling, or torque values are asserted by the animation.
