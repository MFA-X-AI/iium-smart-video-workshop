Paper: Measuring Human Capital in Indonesia Using an Adapted World Bank HCI Framework.
ALL 34 provincial period-average HCI scores come directly from Table 6, pp.12–13.
DI Yogyakarta 78.16 is highest; Papua 59.63 lowest (2011–2019 averages).
All towers use equal footprints, one ZERO-BASED height scale (0.058 units/point),
and one single-hue sequential blue colour scale. No estimated scores or omitted table rows.
Artistic licence: schematic coastlines and province positions, compressed map depth,
small Java location offsets, uniform map extrusion, wave timing and shallow orthographic framing.
The wave REVEALS period averages; it is NOT a time series, trend, geographic diffusion,
policy effect or productivity percentage. Colours encode the table's observed HCI range.
The map follows the study's 34-province geography, not present-day subdivisions.
-->

const papua=towers.find(p=>p.name==='PAPUA');
const referenceMat=new THREE.LineDashedMaterial({color:0x39778c,transparent:true,opacity:0,dashSize:.14,gapSize:.11});
const reference=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),referenceMat);scene.add(reference);
const bracketMat=new THREE.LineBasicMaterial({color:0x39778c,transparent:true,opacity:0});
const bracket=new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(Array.from({length:6},()=>new THREE.Vector3())),bracketMat);scene.add(bracket);
const clamp=x=>Math.max(0,Math.min(1,x));
const smooth=(a,b,t)=>{const x=clamp((t-a)/(b-a));return x*x*(3-2*x);};
const ease=x=>1-Math.pow(1-clamp(x),3);
function project(v){const p=v.clone().project(camera);return {x:(p.x*.5+.5)*W,y:(.5-p.y*.5)*H};}
function topOf(tower,amount){return new THREE.Vector3(tower.anchor.x,BASE+tower.height*amount,tower.anchor.z);}
// Audit the fully revealed encoding, not absolute screen Y of each map location.
// During the wave, the moving lengths are explicitly a reveal of these target lengths.
function verifyHeightEncoding(){
 const rows=towers.map(data=>{
  const base=project(new THREE.Vector3(data.anchor.x,BASE,data.anchor.z));
  const top=project(topOf(data,1));
  return {name:data.name,score:data.score,pixels:Math.hypot(base.x-top.x,base.y-top.y)};
 }).sort((a,b)=>b.pixels-a.pixels);
 const perPoint=rows[0].pixels/rows[0].score;
 if(rows[0].name!=='DI YOGYAKARTA'||rows.at(-1).name!=='PAPUA'||
    rows.some(row=>Math.abs(row.pixels/row.score-perPoint)>1e-9)){
  throw new Error('Projected HCI height scale is inconsistent.');
 }
 return {pixelsPerPoint:perPoint,highest:rows[0],lowest:rows.at(-1),rows};
}
function positionLabel(id,tip,dx,dy,opacity){
 const el=document.getElementById(id),p=project(tip),x=p.x+dx,y=p.y+dy;el.style.left=x+'px';el.style.top=y+'px';el.style.opacity=opacity;
 const line=document.getElementById(id+'-line');const endX=dx<0?x+190:x-16,endY=y+45;
 line.setAttribute('d',`M ${p.x} ${p.y} L ${p.x+(dx<0?-42:42)} ${endY} L ${endX} ${endY}`);line.style.opacity=opacity;
 return {x,y,tip:p};
}
function draw(t){
 // Lock the camera throughout the reveal: no perspective, orbit or scale change.
 const settle=1;
 for(const data of towers){
  data.rise=smooth(data.arrival,data.arrival+.77,t);
  const height=Math.max(.012,data.height*data.rise);
  data.body.scale.y=height;data.body.position.y=height/2;data.cap.position.y=height;
  data.ribs.scale.y=data.rise;data.ribs.visible=data.rise>.035;
  const flash=Math.sin(Math.PI*data.rise)*.24;
  data.wall.emissiveIntensity=flash;data.capMat.emissiveIntensity=flash;
  const isExtreme=data===yogya||data===papua;
  data.halo.scale.setScalar(1+(isExtreme?.35*smooth(1.9,2.3,t):0));
  data.halo.material.opacity=.45+(isExtreme?.5*smooth(1.9,2.3,t):0);
 }
 const a=topOf(yogya,yogya.rise),b=topOf(papua,papua.rise);
 const lineEnd=new THREE.Vector3(papua.anchor.x,BASE+yogya.height,papua.anchor.z);
 const reveal=smooth(1.95,2.48,t),refEnd=a.clone().lerp(lineEnd,reveal);
 reference.geometry.setFromPoints([a,refEnd]);reference.computeLineDistances();referenceMat.opacity=.7*smooth(1.9,2.16,t);
 const q=lineEnd.clone();q.x+=.43;const r=b.clone();r.x+=.43;
 bracket.geometry.setFromPoints([q,r,q.clone().add(new THREE.Vector3(-.1,0,0)),q.clone().add(new THREE.Vector3(.1,0,0)),r.clone().add(new THREE.Vector3(-.1,0,0)),r.clone().add(new THREE.Vector3(.1,0,0))]);bracketMat.opacity=smooth(2.35,2.65,t)*.85;
 const labels=smooth(1.94,2.28,t);
 const ly=positionLabel('yogya',a,35,50-project(a).y,labels);
 const lp=positionLabel('papua',b,72,-25,labels);
 const gp=project(a.clone().lerp(lineEnd,.61));const gap=document.getElementById('gap');gap.style.left=(project(b).x+72)+'px';gap.style.top=(project(lineEnd).y-38)+'px';gap.style.opacity=smooth(2.2,2.6,t);
 renderer.render(scene,camera);
 return {t,settle,yogya:ly,papua:lp,referenceStart:project(a),referenceEnd:project(lineEnd),provinces:towers.map(p=>({name:p.name,score:p.score,rise:p.rise,base:project(new THREE.Vector3(p.anchor.x,BASE,p.anchor.z)),top:project(topOf(p,p.rise))}))};
}
const heightAudit=verifyHeightEncoding();
const query=new URLSearchParams(location.search);const parsed=Number(query.get('t'));
const frozen=query.has('t')&&Number.isFinite(parsed);const start=performance.now();
function frame(now){const t=frozen?Math.max(0,parsed):Math.min((now-start)/1000,3);draw(t);if(!frozen&&t<3)requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.__KENMS={draw,project,camera,islands,landMeshes,yogya,papua,towers,provinces,scoreColor,heightAudit,verifyHeightEncoding};
document.getElementById('scene').addEventListener('webglcontextlost',e=>{e.preventDefault();document.getElementById('failure').style.display='block';});
</script>
