<!--
PAPER: Kartikasari et al., Jurnal Respirasi 12(2), 97–103 (2026), supplied KON PDF.
60-person quasi-experiment: asthma exercise plus medication produced a greater increase
in peak expiratory flow than medication alone. Three sessions over one week. No numerical
outcome is displayed. This is a before/after illustration of the group finding.
ARTISTIC LICENCE: stylized anatomy, breathing amplitude, air ribbons, particle velocity,
colour and a week compressed into seconds. No measured airway dilation, cure, oxygenation
or individual benefit is claimed. Branch centrelines move with illustrative breathing, while tube radii stay fixed. Stream bulk and compression are artistic emphasis on peak flow, not measurements of lung volume.
The external plume continues from a cropped upper airway; its bend is a compositional
flow visualization, not a literal mouth or a measured flow field.
-->

function stateAt(t){
