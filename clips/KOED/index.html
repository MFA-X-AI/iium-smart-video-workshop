    // Ink lettering on transparent planes: part of the manuscript, without UI cards.

    const thinInk=new THREE.MeshStandardMaterial({color:'#69401c',roughness:.96,transparent:true,opacity:.72});
    for(const r of [.47,REFERENCE_RADIUS,...intervals.map(d=>REFERENCE_RADIUS*d.length)])circle(r,0,thinInk,construction,.009);
    const proportionRings=intervals.map((d,index)=>{
      const radius=REFERENCE_RADIUS*d.length;
      const ring=circle(radius,.035+index*.009,gold,construction,.019);
      // Reorder torus triangles by major-circle sector for a true arc reveal.
      const oldIndex=ring.geometry.index.array,ordered=[];
      for(let sector=0;sector<128;sector++)for(let cross=0;cross<6;cross++)for(let k=0;k<6;k++)ordered.push(oldIndex[(cross*128+sector)*6+k]);
      ring.geometry.setIndex(ordered);ring.rotation.z=-Math.PI/2;
      const arm=box(radius,.018,.024,lightGold,construction,radius/2,0,.07);
      const angle=-Math.PI/2+(index-1)*Math.PI/3;
      const reference=box(REFERENCE_RADIUS,.009,.009,thinInk,construction,Math.cos(angle)*REFERENCE_RADIUS/2,Math.sin(angle)*REFERENCE_RADIUS/2,.013);
      reference.rotation.z=angle;
      const tick=box(.10,.023,.025,gold,construction,Math.cos(angle)*radius,Math.sin(angle)*radius,.075);tick.rotation.z=angle+Math.PI/2;
      const pen=mesh(new THREE.SphereGeometry(.043,12,8),glow,construction);
      const label=manuscriptLabel(`${d.fraction} → ${d.pitch}`,d.name,1.32,.76,book);
      const x=1.20+index*1.36;
      // Flat label over a curved page: lift it clear of the page's highest point under its width,
      // or the page occludes the label's ends (it clipped the "1" of 2:1 and the "3" of ¾).
      const lift=Math.max(pageZ(x-.66,-1.58),pageZ(x,-1.58),pageZ(x+.66,-1.58))+.06;
      label.position.set(x,-1.58,lift);
      return {ring,arm,tick,pen,label,radius,angle,totalIndices:ring.geometry.index.count};
    });
    const lengthHeading=manuscriptLabel('length → pitch','',3.4,.43,book);
    lengthHeading.position.set(2.56,-.98,pageZ(2.56,-.98)+.045);
    const petals=[], rails=[];
    for(let i=0;i<12;i++) {
      const a=i*TAU/12;
      const group=new THREE.Group();group.rotation.z=a;rosette.add(group);
      const hinge=new THREE.Group();hinge.position.x=.18;group.add(hinge);
      // Half radius fixes the star's inner corners; two-thirds fixes petal
      // shoulders; three-quarters fixes the enamel tips. All share outer R.
      const half=REFERENCE_RADIUS/2,thirds=REFERENCE_RADIUS*2/3,quarters=REFERENCE_RADIUS*3/4;
      const sx=thirds*Math.cos(.13)-.18,sy=thirds*Math.sin(.13);
      const shape=new THREE.Shape();shape.moveTo(.12,0);
      shape.quadraticCurveTo(half-.18,-.035,sx,-sy);
      shape.quadraticCurveTo(quarters-.18,-.40,REFERENCE_RADIUS-.18,0);
      shape.quadraticCurveTo(quarters-.18,.40,sx,sy);
      shape.quadraticCurveTo(half-.18,.035,.12,0);
      const petal=mesh(new THREE.ExtrudeGeometry(shape,{depth:.034,bevelEnabled:true,bevelThickness:.01,bevelSize:.016,bevelSegments:2,curveSegments:16}),gold,hinge);
      // An inset translucent enamel centre leaves broad gold-leaf edges.
      const inset=new THREE.Shape();inset.moveTo(.35,0);inset.quadraticCurveTo(thirds-.18,-.255,quarters-.18,0);inset.quadraticCurveTo(thirds-.18,.255,.35,0);
      const enamel=mesh(new THREE.ShapeGeometry(inset,24),lapis,hinge);enamel.position.z=.048;
      const spine=tube([new THREE.Vector3(.24,0,.065),new THREE.Vector3(.9,0,.066),new THREE.Vector3(1.47,0,.05)],.012,lightGold,hinge);
      const bead=mesh(new THREE.SphereGeometry(.039,10,8),lightGold,hinge);bead.position.set(1.47,0,.075);
      // Ink leaf on the manuscript precedes the same raised golden leaf.
      const outlinePts=shape.getPoints(48).map(p=>new THREE.Vector3(p.x+.18,p.y,.012));
      const traced=tube(outlinePts,.009,thinInk,construction,true);traced.rotation.z=a;
      petals.push({group,hinge,index:i});
    }
    for(let layer=0;layer<2;layer++) {
      const pts=[];const n=12;
      for(let i=0;i<n*2;i++) {const a=i*Math.PI/n+layer*Math.PI/12;const r=i%2?REFERENCE_RADIUS/2:REFERENCE_RADIUS;pts.push(new THREE.Vector3(Math.cos(a)*r,Math.sin(a)*r,.04));}
      const rail=tube(pts,.018,lightGold,rosette,true);rails.push(rail);
    }
    const crown=new THREE.Group();rosette.add(crown);
    circle(.44,0,gold,crown,.045);circle(.29,.01,lightGold,crown,.018);
    const centreStone=mesh(new THREE.SphereGeometry(.24,32,16),lapis,crown);centreStone.scale.z=.4;
    for(let i=0;i<12;i++) {const a=i*TAU/12;const gem=mesh(new THREE.OctahedronGeometry(.055),lightGold,crown);gem.position.set(.365*Math.cos(a),.365*Math.sin(a),.025);}

    // A solid gold ribbon and fine filaments carry the pluck to the pattern.
    const waveGroup=new THREE.Group();book.add(waveGroup);
    const waveStart=new THREE.Vector3(-2.14,-1.07,1.70);
    const waveEnd=new THREE.Vector3(2.05,1.15,.7);
    function wavePoint(u,t,offset=0) {
      const p=waveStart.clone().lerp(waveEnd,u);
      const env=Math.pow(Math.sin(Math.PI*u),.8);
      p.y+=Math.sin(u*TAU*2.5-t*7+offset)*.20*env;
      p.z+=Math.sin(Math.PI*u)*(.70+offset*.08)+Math.sin(u*TAU*2.5-t*7+offset)*.23*env;
      return p;
    }
    const waveGeometry=new THREE.BufferGeometry();
    const waveSegments=160,wavePositions=new Float32Array((waveSegments+1)*2*3),waveIndices=[];
    for(let i=0;i<waveSegments;i++){const a=i*2;waveIndices.push(a,a+1,a+2,a+1,a+3,a+2);}
    waveGeometry.setAttribute('position',new THREE.BufferAttribute(wavePositions,3));waveGeometry.setIndex(waveIndices);
    const waveMaterial=new THREE.MeshStandardMaterial({color:'#ffd477',emissive:'#efa126',emissiveIntensity:.85,metalness:.7,roughness:.3,side:THREE.DoubleSide,transparent:true});
    const wave=mesh(waveGeometry,waveMaterial,waveGroup);wave.frustumCulled=false;wave.castShadow=false;
    const filaments=[];
    for(let j=0;j<3;j++){
      const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array((waveSegments+1)*3),3));
      const line=new THREE.Line(geo,new THREE.LineBasicMaterial({color:'#ffdda0',transparent:true}));line.frustumCulled=false;waveGroup.add(line);filaments.push(line);
    }
    const pulse=mesh(new THREE.SphereGeometry(.064,16,12),glow,book);

    const fleckCount=170;
    const flecks=new THREE.InstancedMesh(new THREE.PlaneGeometry(.045,.027),gold,fleckCount);flecks.instanceMatrix.setUsage(THREE.DynamicDrawUsage);flecks.frustumCulled=false;book.add(flecks);
    const fleckData=Array.from({length:fleckCount},()=>({a:random()*TAU,r:.25+random()*1.65,z:random(),delay:random()*.6,spin:random()*TAU}));
    const dummy=new THREE.Object3D();
    const dustGeometry=new THREE.BufferGeometry();
    const dustPositions=new Float32Array(120*3);
    for(let i=0;i<120;i++){dustPositions[i*3]=-9+random()*11;dustPositions[i*3+1]=-5+random()*10;dustPositions[i*3+2]=.2+random()*4;}
    dustGeometry.setAttribute('position',new THREE.BufferAttribute(dustPositions,3));
    const dust= new THREE.Points(dustGeometry,new THREE.PointsMaterial({color:'#dabb7c',size:.021,transparent:true,opacity:.34,depthWrite:false}));scene.add(dust);

    // Present the actual scene directly to the default framebuffer. Gold highlights
    // come from the materials/lights, without a postprocessing presentation chain.
    const viewport = {width:0, height:0, ratio:0};
    function resize() {
      const w=Math.max(1,film.clientWidth),h=Math.max(1,film.clientHeight);
      const ratio=Math.min(window.devicePixelRatio||1,1.5,1920/w);
      if(w!==viewport.width || h!==viewport.height || ratio!==viewport.ratio) {
        renderer.setPixelRatio(ratio);
        renderer.setSize(w,h,false); // Resizing clears the drawing buffer, even when frozen.
        Object.assign(viewport,{width:w,height:h,ratio});
        camera.aspect=w/h;
        camera.updateProjectionMatrix();
      }
      draw(currentTime,frozen); // Always repaint the selected moment after a resize.
    }

    function verifyCanvas() {
      // Read actual DEFAULT-framebuffer pixels, not an offscreen target or a render
      // counter. This region covers the manuscript and excludes the HTML title.
      const gl=renderer.getContext();
      const width=gl.drawingBufferWidth,height=gl.drawingBufferHeight;
      const x=Math.floor(width*.08),y=Math.floor(height*.20);
      const w=Math.max(1,Math.floor(width*.49)),h=Math.max(1,Math.floor(height*.62));
      const pixels=new Uint8Array(w*h*4);
      gl.readPixels(x,y,w,h,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
      let minimum=255,maximum=0,lit=0,total=0;
      for(let i=0;i<pixels.length;i+=4) {
        const luminance=.2126*pixels[i]+.7152*pixels[i+1]+.0722*pixels[i+2];
        minimum=Math.min(minimum,luminance);maximum=Math.max(maximum,luminance);
        total+=luminance;if(luminance>65)lit++;
      }
      const rect=renderer.domElement.getBoundingClientRect();
      const canvasStyle=window.getComputedStyle(renderer.domElement);
      const layoutVisible=rect.width>0 && rect.height>0 && canvasStyle.display!=='none' && canvasStyle.visibility!=='hidden' && Number(canvasStyle.opacity)>0;
      const error=gl.getError();
      const diagnostics={
        time:currentTime,renderCount,width,height,drawCalls:renderer.info.render.calls,
        meanLuminance:total/(w*h),contrast:maximum-minimum,litFraction:lit/(w*h),
        layoutVisible,glError:error,contextLost:gl.isContextLost()
      };
      const valid=width>0 && height>0 && diagnostics.drawCalls>0 && layoutVisible &&
        !diagnostics.contextLost && error===gl.NO_ERROR && diagnostics.contrast>18 && diagnostics.litFraction>.04;
      window.__KOED_RENDER_CHECK__={...diagnostics,ok:valid};
      window.__KOED_READY__=valid;
      film.dataset.renderStatus=valid?'ok':'empty';
      renderer.domElement.dataset.drawn=valid?'true':'false';
      fallback.style.display=valid?'none':'block';
      if(!valid) {
        fallback.textContent='The manuscript scene could not be drawn.';
        console.error('KOED: canvas verification failed',window.__KOED_RENDER_CHECK__);
      }
      return valid;
    }

    const PERIOD=4.8;
    function stringState(t) {
      let index=-1,length=1;
      for(let i=0;i<intervals.length;i++) {
        const d=intervals[i],previous=i?intervals[i-1].length:1;
        if(t>=d.stop){index=i;length=THREE.MathUtils.lerp(previous,d.length,smooth(d.stop,d.stop+.08,t));}
      }
      const pluckTime=index<0?.12:intervals[index].pluck;
      const age=Math.max(0,t-pluckTime);
      return {index,length,frequencyRatio:1/length,pluckTime,age,amplitude:t>=pluckTime?.12*Math.exp(-age*2):0};
    }
    function stateAt(t) {
      const string=stringState(t);
      const d=intervals[Math.max(0,string.index)];
      const age=t-d.pluck;
      return {
        pluck:smooth(string.pluckTime-.08,string.pluckTime,t),
        release:smooth(string.pluckTime,string.pluckTime+.09,t),
        front:smooth(d.pluck,d.arrival,t),
        ribbon:smooth(0,.045,age)*(1-(string.index===2?.55:1)*smooth(.52,.66,age))*(1-smooth(3.25,3.6,t)),
        assembly:smooth(.78,2.85,t),
        string,
        fade:smooth(3.85,4.20,t)*(1-smooth(4.58,4.80,t))
      };
    }
    function draw(t,verify=false) {
      currentTime=t;
      const local=t%PERIOD;
      // Reset beneath the opaque fade, so the autoplay loop has no visible jump.
      const shotTime=local>4.25?0:local;
      const s=stateAt(shotTime);
      film.dataset.time=t.toFixed(3);
      fade.style.opacity=String(stateAt(local).fade);
      for(let i=0;i<stringCount;i++) {
        const p=strings[i].geometry.attributes.position;
        const base=(i-(stringCount-1)/2)*.035;
        for(let j=0;j<=stringSegments;j++) {
          const u=j/stringSegments;
          p.setXYZ(j,base,BRIDGE_Y+STRING_LENGTH*u,.52-.085*u);
        }
        p.needsUpdate=true;
      }
      // Only the selected course vibrates, between bridge and the active stop.
      // One antinode and fixed endpoints; slowed frequencies preserve f/f0=1/(L/L0).
      const active=s.string;
      for(let j=0;j<=stringSegments;j++) {
        const v=j/stringSegments,u=v*active.length;
        const x=active.amplitude*Math.sin(Math.PI*v)*Math.cos(TAU*3.2*active.frequencyRatio*active.age);
        const y=BRIDGE_Y+STRING_LENGTH*u,z=.535-.085*u;
        activeStringPositions.set([x-.018,y,z,x+.018,y,z],j*6);
      }
      activeStringGeometry.attributes.position.needsUpdate=true;activeStringGeometry.computeVertexNormals();
      stopper.visible=active.index>=0;
      stopper.position.set(0,BRIDGE_Y+STRING_LENGTH*active.length,.535-.085*active.length);
      stringMarks.forEach(({group,label},i)=>{
        group.visible=shotTime>=intervals[i].stop;
        label.material.opacity=i===active.index?1:.75;
      });
      // Every pluck transfers to the matching construction radius, then raises
      // its group of four petals. Earlier gold circles remain for comparison.
      const selected=Math.max(0,active.index);
      proportionRings.forEach(({ring,arm,tick,pen,label,radius,angle},i)=>{
        const d=intervals[i],progress=smooth(d.arrival,d.arrival+.32,shotTime);
        ring.geometry.setDrawRange(0,Math.floor(progress*128)*36);
        ring.visible=progress>0;arm.visible=progress>0;tick.visible=progress>0;
        arm.rotation.z=angle;
        arm.position.set(Math.cos(angle)*radius/2,Math.sin(angle)*radius/2,.07);
        pen.visible=progress>0&&progress<1;
        const theta=-Math.PI/2+TAU*progress;
        pen.position.set(Math.cos(theta)*radius,Math.sin(theta)*radius,.10);
        label.material.opacity=smooth(d.stop,d.stop+.08,shotTime);
        if(i===selected)waveEnd.set(rosette.position.x+Math.cos(theta)*radius*rosette.scale.x,rosette.position.y+Math.sin(theta)*radius*rosette.scale.y,rosette.position.z+.115);
      });
      plectrum.position.set(-.30+s.pluck*.31+s.release*.38,-.65,.57+s.release*.28);
      plectrum.rotation.z=-.60-s.release*.6;
      plectrum.visible=shotTime>=active.pluckTime-.1&&shotTime<active.pluckTime+.18;
      wave.visible=s.ribbon>.001;
      waveMaterial.opacity=s.ribbon*.94;
      for(let i=0;i<=waveSegments;i++) {
        const u=i/waveSegments*s.front;
        const p=wavePoint(u,shotTime);
        const width=.004+.052*Math.sin(Math.PI*i/waveSegments);
        wavePositions[i*6]=p.x;wavePositions[i*6+1]=p.y-width;wavePositions[i*6+2]=p.z;
        wavePositions[i*6+3]=p.x;wavePositions[i*6+4]=p.y+width;wavePositions[i*6+5]=p.z+.02;
        for(let k=0;k<filaments.length;k++) {const q=wavePoint(u,shotTime,(k-1)*.75);filaments[k].geometry.attributes.position.setXYZ(i,q.x,q.y+(k-1)*.07,q.z+(k-1)*.04);}
      }
      waveGeometry.attributes.position.needsUpdate=true;waveGeometry.computeVertexNormals();
      for(const line of filaments){line.geometry.attributes.position.needsUpdate=true;line.material.opacity=s.ribbon*.7;line.visible=wave.visible;}
      pulse.visible=s.ribbon>.01&&s.front<1;pulse.position.copy(wavePoint(s.front,shotTime));
      book.updateMatrixWorld(true);
      travellingLight.position.copy(pulse.position).applyMatrix4(book.matrixWorld);travellingLight.position.z+=.3;
      travellingLight.intensity=pulse.visible?6:1.6*s.ribbon;
      for(const {group,hinge,index} of petals) {
        const interval=intervals[Math.floor(index/4)];
        const progress=ease((shotTime-interval.arrival-.12-(index%4)*.035)/.47);
        const lift=Math.sin(progress*Math.PI)*.50;
        group.position.z=.008+progress*.85+lift*.25;
        hinge.rotation.y=-Math.sin(progress*Math.PI)*1.22;
        hinge.rotation.x=Math.sin(progress*Math.PI)*.13;
        hinge.scale.setScalar(.90+.1*progress);
        group.visible=progress>0;
      }
      rails.forEach((rail,i)=>{
        const p=ease((shotTime-intervals[i].arrival-.1)/.55);
        rail.visible=p>0;
        rail.scale.setScalar(.78+.22*p);rail.position.z=.025+p*(1.05+i*.15);
        rail.rotation.z=(1-p)*(.17+i*.04);
      });
      crown.position.z=.03+1.30*ease((shotTime-2.1)/.7);
      crown.rotation.z=.13*(1-smooth(2.1,2.8,shotTime));
      fleckData.forEach((d,i)=>{
        const age=shotTime-.92-d.delay;
        const alive=age>0&&age<1.45;
        const r=d.r+.28*Math.max(0,age);
        dummy.position.set(rosette.position.x+Math.cos(d.a)*r,rosette.position.y+Math.sin(d.a)*r,.54+Math.max(0,age)*(.8+d.z*.5)-.31*Math.max(0,age)**2);
        dummy.rotation.set(d.spin+age*3,d.a+age*2,d.spin);
        dummy.scale.setScalar(alive?.35+.85*Math.sin(Math.PI*age/1.45):0);
        dummy.updateMatrix();flecks.setMatrixAt(i,dummy.matrix);
      });
      flecks.instanceMatrix.needsUpdate=true;
      dust.rotation.z=Math.sin(shotTime*.3)*.007;
      key.position.x=-5+Math.sin(shotTime*.7)*1.1;
      scene.updateMatrixWorld(true);
      camera.updateMatrixWorld(true);
      renderer.setRenderTarget(null);
      renderer.setScissorTest(false);
      renderer.setViewport(0,0,viewport.width,viewport.height);
      renderer.autoClear=true;
      renderer.render(scene,camera);
      renderCount++;
      film.dataset.renderCount=String(renderCount);
      if(verify)verifyCanvas();
    }

    window.addEventListener('resize',resize);
    resize();
    if(frozen) {
      // A second, identical presentation after layout settles; never advance time.
      window.requestAnimationFrame(()=>resize());
    } else {
      const start=performance.now();
      renderer.setAnimationLoop(now=>draw((now-start)/1000));
    }
    renderer.domElement.addEventListener('webglcontextlost',event=>{
      event.preventDefault();window.__KOED_READY__=false;film.dataset.renderStatus='context-lost';
    });
    renderer.domElement.addEventListener('webglcontextrestored',()=>resize());
  </script>
</body>
</html>
