<!--
Research: Asif et al. (2025), pp. 960-967, especially Fig. 5 (visual integration)
and Fig. 6 (axial/global integration). The market spine is most integrated, the
perpendicular route is also strongly integrated, museum/transitional routes are
intermediate, and peripheral accommodation lanes generally have lower integration.
Fig. 7 is controllability, a different metric, and is NOT used as an integration map.
Artistic licence: schematic model footprints and a qualitative, warm-to-cool overlay;
not digitized GIS, a recalculated space-syntax analysis, or a numerical result scale.
Light propagating from the market/Juma core is an editorial reveal of a static analysis,
not a claim that integration diffuses with time or equals distance from the mosque.
Courtyard enclosures are present throughout. Their unlit interiors signify residential
privacy; this does not imply all courtyards are poorly integrated (Fig. 5 explicitly
identifies two highly integrated public/transitional courtyards).
-->

 }

  if(i<sampled.length-1){const k=i*2;indices.push(k,k+2,k+1,k+1,k+2,k+3);}
 }
