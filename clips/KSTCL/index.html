<!--
PAPER: Hamzah, Jalaluddin & Tinggom (2025), scanned abstract pp.167–168 and
conclusion pp.188–189: Langkawi and Satun Malay dialects mix through community
mobility and have high mutual intelligibility. The four studied lexical items
are air, bantal, kelapa and tajam. Historical, migration, educational and border
factors influence their distribution. Printed p.172 describes transcription and
GIS mapping; Figures 1–2 (pp.173–174) show dialect-location distributions.
ARTISTIC LICENCE: simplified coastlines, paper relief, decorative topography,
border placement, ink colours, connection endpoints and animated raised ink
bridges. Late dashed isoglosses illustrate the GIS method, informed by those
distributions; their paths are schematic, NOT digitised survey boundaries.
The figures' administrative boundaries are not treated as isoglosses.
These are NOT field sites, measured isoglosses, migration routes,
phonetic waveforms or quantitative flows. Word labels are lexical categories,
not regional pronunciation transcriptions. Distinct colours remain distinct.
-->

// Flat pen strokes use actual ribbon geometry: WebGL lineWidth is unreliable.
function inkStroke(points,color,opacity=.75,width=.012,dashed=false){
 const positions=[],indices=[];let distance=0;
 for(let i=0;i<points.length;i++){
  const p=points[i],prev=points[Math.max(0,i-1)],next=points[Math.min(points.length-1,i+1)];
  if(i)distance+=Math.hypot(p[0]-prev[0],p[1]-prev[1]);
  const dx=next[0]-prev[0],dy=next[1]-prev[1],len=Math.hypot(dx,dy)||1;
  const pressure=width*(.7+.22*Math.sin(distance*9)+.16*Math.sin(distance*27+1));
  positions.push(p[0]-dy/len*pressure,p[1]+dx/len*pressure,p[2],p[0]+dy/len*pressure,p[1]-dx/len*pressure,p[2]);
  if(i&&(!dashed||distance%.21<.135)){const n=i*2;indices.push(n-2,n-1,n,n-1,n+1,n);}
 }
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));g.setIndex(indices);
 const mesh=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color,transparent:true,opacity,side:THREE.DoubleSide,depthWrite:false}));scene.add(mesh);return mesh;
}

}

}

// Late GIS payoff. Schematic paths illustrate the method, not recovered data.
function contains(points,x,y){
 let inside=false;
 for(let i=0,j=points.length-1;i<points.length;j=i++){
  const a=points[i],b=points[j];
  if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])inside=!inside;
 }
 return inside;
}
function surfaceHeight(x,y){
 const surfaces=landShapes.filter(s=>contains(s.points,x,y));
 if(!surfaces.length)return null;
 let z=Math.max(...surfaces.map(s=>s.z))+.05;
 for(const h of hills){
  const a=Math.atan2((y-h.cy)/h.ry,(x-h.cx)/h.rx),rough=1+.075*Math.sin(a*5+h.cx)+.045*Math.cos(a*9);
  const r=Math.hypot((x-h.cx)/h.rx,(y-h.cy)/h.ry)/rough;
  if(r<1)z=Math.max(z,.29+Math.min(h.levels-1,Math.floor((1-r)*(h.levels+1)))*.045);
 }
 return z;
}
const isoglosses=[];

 for(const p of curve.getPoints(240)){
  const z=surfaceHeight(p.x,p.y);
  if(z===null){if(section.length>2)sections.push(section);section=[];}
  else section.push([p.x,p.y,z+.007*Math.sin(section.length*.9)]);
 }

  const mesh=inkStroke(points,'#783e49',.89,.021,true);
  const count=mesh.geometry.index.count;mesh.geometry.setDrawRange(0,0);
  isoglosses.push({mesh,count,delay,points});
 }
}

  const pts=curve.getPoints(segments).map((p,j)=>p.add(new THREE.Vector3(0,(k-1)*.035+Math.sin(j*.47+index)*.007,Math.sin(j*.38)*.006)));

 const text=['air','bantal','kelapa','tajam'][index];

function update(t){
 // A six-percent push and slight lateral drift, independent of the text overlay.
 const drift=smooth(0,3,t);
 camera.zoom=1+drift*.06;camera.position.set(.16*drift,-8+.10*drift,25);
 camera.lookAt(.16*drift,.4+.10*drift,0);camera.updateProjectionMatrix();
 const mapping=smooth(1.70,2.12,t);
 methodLabel.material.opacity=mapping;methodNote.material.opacity=mapping*.85;
 for(const iso of isoglosses){
  const q=smooth(1.72+iso.delay,2.67+iso.delay,t);
  iso.mesh.geometry.setDrawRange(0,Math.floor(q*iso.count/6)*6);
 }
 for(const tr of tracks){
  const delay=tr.index*.13;
  const progress=1-Math.pow(1-clamp((t-.02-delay)/1.25),2);
  for(const m of tr.parts)m.geometry.setDrawRange(0,Math.floor(progress*tr.segments)*5*6);
  tr.ribbon.geometry.setDrawRange(0,Math.floor(progress*tr.segments)*6);
  tr.bead.visible=progress>.002&&progress<.999;tr.bead.position.copy(tr.curve.getPoint(progress));
  tr.word.material.opacity=smooth(tr.wordAt-.1,tr.wordAt+.08,progress)*(1-.25*mapping);
  for(const m of tr.parts)m.material.opacity=(m===tr.parts[1]?.94:.48)*(1-.30*mapping);
  tr.ribbon.material.opacity=.20*(1-.30*mapping);
  for(let k=0;k<tr.rings.length;k++){
   const q=smooth(1.3+delay+k*.09,2.35+delay+k*.09,t);
   tr.rings[k].scale.setScalar(.65+q*.85);
   tr.rings[k].material.opacity=q*(.38-k*.075);
  }
 }
 renderer.render(scene,camera);
}
const params=new URLSearchParams(location.search);
const raw=params.get('t'),parsed=raw===null?NaN:Number(raw);
const frozen=raw!==null&&Number.isFinite(parsed);
// Frozen states bypass the animation clock; no time-dependent randomness.
if(frozen){update(Math.max(0,parsed));}
else{
 const began=performance.now();
 function animate(now){const t=((now-began)/1000)%4.6;update(Math.min(t,3));requestAnimationFrame(animate);}
 requestAnimationFrame(animate);
}
// Read-only hooks for static mathematical QA, without running a browser.
export {camera,tracks,isoglosses,update,scene};
</script>
