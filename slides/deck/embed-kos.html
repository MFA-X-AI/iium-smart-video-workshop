<!doctype html>
<!--
PAPER: Selected KOS / "Top pick (KOS)" row in papers.json; PDF unavailable.
Noorbahrin et al. (2025), Results in Optics, doi:10.1016/j.rio.2025.100928.
The supplied summary describes fusion-spliced glass microspheres, tapered-fibre
coupling, better performance at contact than at a 10 micrometre gap, and a
temperature sensitivity of 14.9 pm/degree C. No numerical result is drawn here.
MECHANISM: Evanescent coupling excites a near-surface WGM inside the bead.
Thermo-optic and thermal-expansion effects shift its resonance on warming.
ARTISTIC LICENCE: Macro scale, studio reflections, illustrative external heater,
heat ribbons, slowed optical crests, field thickness and three-second timing.
The outgoing fibre carries a magnified electric-field illustration: its drawn
wavelength stretches strongly to expose a tiny spectral shift. This is not a
measured amplitude, spatial scale, response time or change in WGM modal order.
Two-interface refraction and path-length absorption give the solid bead volume;
the focused caustic is a qualitative studio-light effect, not measured data.
The cyan-to-coral change is false colour for a magnified resonance-wavelength
shift under continuous interrogation/tracking, NOT fixed-frequency light being
converted to a new colour. Geometry does not visibly expand; modal order stays
constant. This is not a reconstruction of the paper's experimental apparatus.
Everything is procedural; Three.js 0.169.0 is bundled inline (built for the workshop deck).
-->
